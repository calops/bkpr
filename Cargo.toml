[workspace]
members = [
    "crates/bkpr",
    "crates/bkpr-client",
    "crates/bkpr-tui-framework",
    "crates/bkpr-server",
    "crates/bkpr-core",
    "crates/bkpr-protocol",
    "crates/bkpr-terminal-engine",
]
default-members = ["crates/bkpr", "crates/bkpr-server"]
exclude = ["vendor/libghostty-rs"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/calops/bkpr"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
