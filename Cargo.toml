[workspace]
members = ["crates/shephrd", "crates/shephrd-zellij"]
default-members = ["crates/shephrd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/calops/shephrd"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

# The WASI SDK decodes messages in both generated guest code and dependency code.
[profile.dev]
opt-level = 1
