[workspace]
members = ["crates/bkpr", "crates/bkpr-zellij"]
default-members = ["crates/bkpr"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/calops/bkpr"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

# The WASI SDK decodes messages in both generated guest code and dependency code.
[profile.dev]
opt-level = 1
