[workspace]
members = ["crates/bkpr-terminal", "crates/bkpr-mux"]
default-members = ["crates/bkpr-mux"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/calops/bkpr"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
