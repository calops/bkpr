[package]
name = "bkpr-tui-framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bkpr-protocol = { path = "../bkpr-protocol" }
base64 = "0.22"
crossterm = { version = "=0.29.0", default-features = false }
termwiz = { version = "=0.23.3", default-features = false }
hashlink = "0.12.2"
libc = "0.2"
nucleo-matcher = "0.3"
palette = { version = "=0.7.7", default-features = false, features = ["std"] }
png.workspace = true
pulldown-cmark = { version = "=0.13.6", default-features = false }
flate2.workspace = true
image = { version = "0.25", default-features = false }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
resvg = { version = "=0.49.0", default-features = false }
rustix = { version = "1.1", features = ["fs", "process"] }
sha2 = "0.11"
tempfile = "3.27"
unicode-segmentation = "1"

[dev-dependencies]
bkpr-terminal-engine = { path = "../bkpr-terminal-engine" }
