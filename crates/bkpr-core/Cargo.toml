[package]
name = "bkpr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
bkpr-protocol = { path = "../bkpr-protocol" }
bkpr-terminal-engine = { path = "../bkpr-terminal-engine" }
portable-pty = "=0.9.0"
libc = "0.2"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
tempfile = "3"
signal-hook = "0.3"
sha2 = "0.10"
notify = "8.2"
ignore = "0.4.34"
mio = { version = "=1.2.4", features = ["net", "os-poll"] }
scraper = { version = "0.29", default-features = false }
time.workspace = true
semver = "1.0.28"
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled", "fallible_uint"] }
png = "0.18"
web-push = { version = "=0.11.0", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
jwt-simple = { version = "=0.12.17", default-features = false, features = ["pure-rust"] }
base64 = "0.22"
iprfc = { version = "=1.0.0", default-features = false }
httpdate = "1"
bytes = "1"
