[package]
name = "bkpr-terminal-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bkpr normalized terminal scenes and authority policy over libghostty-vt"

[dependencies]
bkpr-protocol = { path = "../bkpr-protocol" }
libghostty-vt = { path = "../../vendor/libghostty-rs/crates/libghostty-vt", features = ["png"] }
png.workspace = true

[build-dependencies]
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
base64 = "0.22"
flate2.workspace = true
serde_json.workspace = true
