[package]
name = "bkpr-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
bkpr-protocol = { path = "../bkpr-protocol" }
bkpr-tui-framework = { path = "../bkpr-tui-framework" }
termwiz = { version = "=0.23.3", default-features = false }
libc = "0.2"
signal-hook = "0.3"
unicode-width = "0.2"
nucleo-matcher = "0.3"
unicode-segmentation = "1"
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await", "executor"] }
tokio = { version = "1", features = ["rt", "net", "process", "sync", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
yamux = "=0.14.1"

[dev-dependencies]
tempfile = "3"
