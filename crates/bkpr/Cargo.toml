[package]
name = "bkpr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace-first native Zellij launcher"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
libc = "0.2"
scraper = { version = "0.24", default-features = false }
parking_lot = "0.12"
sha2 = { version = "0.11", default-features = false }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "macros", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["test-util"] }
