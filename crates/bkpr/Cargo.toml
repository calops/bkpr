[package]
name = "bkpr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap = "4.6.7"
clap_complete = "4.6.11"
fs2 = "0.4.3"
sha2 = "0.10.9"
hashlink = "0.12.2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
parking_lot = "0.12"
notify = "8"
pathdiff = "0.2.3"
serde.workspace = true
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
url = "2"
saphyr = { version = "0.3.4", default-features = false }
serde_json.workspace = true
jsonc-parser = { version = "0.34", features = ["serde_json", "cst"] }
tokio = { version = "1", features = ["rt", "sync", "time", "process", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
bkpr-client = { path = "../bkpr-client" }
bkpr-protocol = { path = "../bkpr-protocol" }
bkpr-tui-framework = { path = "../bkpr-tui-framework" }
