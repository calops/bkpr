[package]
name = "bkpr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap = "4.6.7"
clap_complete = "4.6.11"
fs2 = "0.4.3"
sha2 = "0.10.9"
hashlink = "0.12.2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
parking_lot = "0.12"
notify = "8"
serde.workspace = true
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "process", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
bkpr-client = { path = "../bkpr-client" }
bkpr-protocol = { path = "../bkpr-protocol" }
bkpr-tui-framework = { path = "../bkpr-tui-framework" }
