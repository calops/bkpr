[package]
name = "bkpr-zellij"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace-first Zellij sidebar and overlays for bkpr"

[[bin]]
name = "bkpr-zellij"
path = "src/main.rs"

[dependencies]
bkpr = { path = "../bkpr" }
nucleo-matcher = "0.3"
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"
zellij-tile = "=0.45.1"
