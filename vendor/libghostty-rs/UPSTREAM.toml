repository = "https://github.com/Uzaaft/libghostty-rs"
revision = "575ed6b8ceb79ffaf247ecf7e34333876b0d5be4"
archive = "https://codeload.github.com/Uzaaft/libghostty-rs/tar.gz/575ed6b8ceb79ffaf247ecf7e34333876b0d5be4"
archive_sha256 = "fc16a84c73ec9783ce078e2c2d24a64b7e03e7d11039694f06a66e9865d2eeb8"
license_file = "LICENSE"
manifest_license = "MIT OR Apache-2.0"
license_note = "LICENSE is the complete MIT license file shipped in the pinned upstream archive; manifests are retained verbatim."
source_selection = ["Cargo.toml", "LICENSE", "crates"]
local_patch = "patches/sdk-native-and-offer.patch"
local_patch_sha256 = "408430a41477570f80ebf0b8e216f8150a6e2839ba88783df58d600c919002c6"
reacquire = "scripts/prepare-ghostty-sdk.sh OUTPUT_DIRECTORY"
update = "Review upstream safe/sys as a pair, inspect its native pin, update the separately reviewable SDK patch, archive hash and native ABI matrix, regenerate declarations with upstream gen-bindings when new layouts are needed, then run coordinated engine and product acceptance. Do not mix arbitrary system Ghostty with checked-in SDK declarations."

[native]
upstream_sdk_revision = "521cf2c5d30bd48028ca61546c64e7913764073d"
revision = "93967b7f9478e94dcbb42125c8a90f34feb40d75"
archive_sha256 = "af551aa496cf54ff734e11563d45fe2c49739ee754d1740d1ac984a67a42dc70"
contribution = "crates/libghostty-vt-sys/native/clipboard-offer.patch"
contribution_sha256 = "196b39997c6552d9158f763555a72784aae2dbf4fa61aa500554bfd07e28d32c"
prepare = "scripts/prepare-ghostty-vt.sh"
reason_not_downgraded = "521cf2c is 119 commits behind 93967b7. The comparison includes Kitty pending animation/stable image transmission work (eea7beaf7857eb416f0934c9899cf68425104b26) and generalized parser boundaries. Keep the existing native behavior; update the SDK's pin and removed ground-writer declaration instead of silently downgrading."
primary_compare = "https://github.com/ghostty-org/ghostty/compare/521cf2c5d30bd48028ca61546c64e7913764073d...93967b7f9478e94dcbb42125c8a90f34feb40d75"
abi_evidence = "Compared current prepared 939 native headers with the exact 521 source archive. Render/style/screen/key/mouse/Kitty/io/point and allocator headers are unchanged. terminal.h replaces vt_write_until_ground with vt_write_until and adds parser-boundary types; snapshot.h adds APIs not used by Bkpr. The SDK patch changes the actual sys declaration and safe ground writer together. Native and Rust paste/read structs both gain sized optional trailing u64 fields, with 64-bit and wasm32 layout assertions adjusted."

[patch_scope]
native_pin = "Retain 93967b7; declare its exact parser stop layout and call the new symbol from safe vt_write_until_ground."
provenance = "Expose Options::with_offer_id and ClipboardRead::paste_offer_id through the real upstream safe crate; native one-time grants carry the correlation. Both optional fields are size-checked."
prebuilt = "GHOSTTY_INSTALL_DIR accepts a static native installation with a matching source-revision marker; the engine additionally verifies archive/profile/patch and every prepared header/library SHA256. Native source builds apply the packaged native contribution."
pixels = "Fix upstream Image::data to map native GHOSTTY_NO_VALUE to its promised None, preserving temporarily unavailable animation pixels without a product special case."
png_budget = "Add RustPngDecoder::with_max_decoded_bytes. After the SDK's single read_info call computes the expanded RGBA8 byte count, reject an over-budget image before Bytes::new_with_alloc or next_frame. Bkpr configures its shared 64MiB quota; the native PNG allocator's separate larger cap is not a substitute. Preserve in-place grayscale/alpha expansion and default unlimited SDK behavior."
no_parallel_sdk = "Bkpr owns normalized protocol scenes, resource budgets, cached Arc image capture, render-hold frames and device-authority callbacks. Upstream safe types own all terminal/render/input resources and callback/allocator/clipboard FFI. Engine contains no raw native handles, generic FFI wrapper or bindgen invocation."

[capabilities]
verification = "API/source matrix only. Builds/tests/smokes are intentionally reserved for the coordinating parent; these entries do not claim exercised acceptance."
text = "SDK RenderState, RowIterator, CellIterator, CellWide and graphemes_buf retain Unicode/wide/reflow/owned scene behavior. Existing unicode_styles_links_and_owned_frame_survive_mutation covers it."
color_identity = "SDK StyleColor and raw CellContentTag preserve default/palette/explicit RGB identity, including background-only cells and explicit RGB equal to defaults. Existing empty_cell_background_and_palette_override_are_not_lost and explicit_rgb_equal_to_default_and_palette_sources_remain_distinct cover it."
images = "SDK Kitty Graphics/Image data, format and generations preserve native RGB/RGBA/Gray/GrayAlpha buffers and resolved placement geometry. Bkpr captures pixels once into generation-keyed Arc<Image>; repeated snapshots and history reuse the Arc. Original image/virtual-placement/large-buffer/wire tests retained; grayscale PNG and Arc history regression added."
png = "SDK RustPngDecoder via safe DecodePng handles real RGBA, RGB/palette and grayscale(+alpha). Its configurable output budget rejects the computed RGBA8 size before output allocation and pixel decode, independently of the native allocator cap. Bkpr bounds encoded bytes and configures the shared IMAGE_MAX_BYTES output budget. SDK allocator-count regressions cover early rejection and inclusive boundaries; engine consumer regressions cover RGBA expansion boundaries, oversized headers and valid images after rejection. Existing real PNG/invalid bytes acceptance retained."
holds_history = "SDK on_render_hold captures an owned normalized frame before further VT can delete resources; bounded one-second release, independent viewport restore and fresh native renderer after temporary history preserve holds and scrollback. Existing deleted-image/link and history-during-hold tests retained."
input = "SDK Key/Event/Encoder and Mouse/Event/Encoder derive active terminal modes; SDK Focus and Paste preserve focus, modifiers, physical keys, mouse button state, bracketed and unsafe paste checks. Native mode tests retained."
status = "SDK on_program_status/on_semantic_prompt provide native OSC7501 validation/query, replacement/subtree clear, inherited app and bounded records; existing status/capacity lifecycle tests retained."
clipboard = "SDK synchronous read/write request/reply APIs retain exact MIME data, binary payloads, atomic writes, denial and callback panic policy. Invalid non-UTF8 MIME is denied instead of lossy-renamed. Existing OSC52/5522 and six offer/provenance/quota tests retained."
offers = "Native validated one-time password -> sized SDK paste_offer_id -> original engine-owned bytes, expiry, revocation, original-view authority callback, no fallback or upgrade to session grant. Targets-only reads do not consume the correlation."
resources = "16MiB effects/APC; 8MiB clipboard; 64MiB images; 16MiB/10000line scrollback; 32MiB/eight/30second pending offers. File/temp/shared-memory Kitty image media disabled. Product geometry validated by protocol."
parser_boundary = "Added safe-SDK ground-writer link/behavior regression so the native pin update exercises the replacement C symbol rather than only compiling unused declarations."
