name: Tag next release

on:
  workflow_dispatch:

    inputs:
      dry_run:
        description: Preview the next version and changelog without tagging or building
        type: boolean
        default: true
permissions:
  contents: write
  actions: write

concurrency:
  group: version-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preview version and changelog
        if: inputs.dry_run
        run: npx semantic-release --dry-run
      - name: Create conventional release tag and start cache build
        if: ${{ !inputs.dry_run }}
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
