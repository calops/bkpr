name: Publish cached release

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.tag.outputs.release }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/classify-tag.sh "$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-notes.mjs "$TAG" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
