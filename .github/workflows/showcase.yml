name: Refresh README showcase

on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: Published release tag to capture and attach the image to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: readme-showcase-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = 1
            cores = 8
      - uses: cachix/cachix-action@v17
        with:
          name: bkpr
          skipPush: true
      - name: Resolve matching packaged executables
        id: package
        run: |
          package=$(nix build --no-link --print-out-paths .#bkpr)
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Capture the isolated scripted demo
        env:
          BKPR_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          nix develop .#showcase --command python3 scripts/showcase/capture.py \
            --bkpr "$BKPR_PACKAGE/bin/bkpr" --bkprd "$BKPR_PACKAGE/bin/bkprd" \
            --dummy-key-consent allow --security-notice-consent allow \
            --fixture-project-trust allow \
            --fixture-broker-tools allow \
            --output docs/assets/showcase.png
      - name: Upload the image and public provenance
        uses: actions/upload-artifact@v4
        with:
          name: readme-showcase-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            docs/assets/showcase.png
            target/showcase/**/manifest.json
            target/showcase/**/raw.png
  publish:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: capture
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: readme-showcase-${{ github.run_id }}-${{ github.run_attempt }}
          path: showcase
      - name: Attach screenshot without replacing existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          exists=$(gh release view "$RELEASE_TAG" --json assets --jq 'any(.assets[]; .name == "showcase.png")')
          if [[ "$exists" != true ]]; then
            gh release upload "$RELEASE_TAG" showcase/docs/assets/showcase.png
          fi
