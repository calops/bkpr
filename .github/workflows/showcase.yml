name: Refresh README showcase

on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: Published release tag to capture for the hosted image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: readme-showcase
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = 1
            cores = 8
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: bkpr
          skipPush: true
      - name: Resolve matching packaged executables
        id: package
        run: |
          binaries=$(nix build --no-link --print-out-paths .#bkpr.binaries)
          terminfo=$(nix build --no-link --print-out-paths .#bkpr.terminfo)
          echo "path=$binaries" >> "$GITHUB_OUTPUT"
          echo "terminfo=$terminfo/share/terminfo" >> "$GITHUB_OUTPUT"
      - name: Capture the isolated scripted demo
        env:
          BKPR_PACKAGE: ${{ steps.package.outputs.path }}
          BKPR_TERMINFO_DIR: ${{ steps.package.outputs.terminfo }}
        run: |
          nix develop .#showcase --command python3 scripts/showcase/capture.py \
            --bkpr "$BKPR_PACKAGE/bin/bkpr" --bkprd "$BKPR_PACKAGE/bin/bkprd" \
            --dummy-key-consent allow --security-notice-consent allow \
            --fixture-project-trust allow \
            --fixture-broker-tools allow \
            --output target/showcase/site/showcase.png
      - name: Upload the image and public provenance
        uses: actions/upload-artifact@v4
        with:
          name: readme-showcase-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: |
            target/showcase/site/showcase.png
            target/showcase/**/manifest.json
            target/showcase/**/raw.png
      - name: Upload the current screenshot for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/showcase/site
          retention-days: 1
  publish:
    needs: capture
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the current screenshot
        id: deployment
        uses: actions/deploy-pages@v4
