name: Build, cache and publish
on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      macos_installer_smoke:
        description: Build and test an unsigned Apple Silicon installer without publishing it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.policy.outputs.build }}
      release: ${{ steps.policy.outputs.release }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: policy
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            bash .github/scripts/tag-policy.sh build "$TAG" >> "$GITHUB_OUTPUT"
            bash .github/scripts/classify-tag.sh "$TAG" >> "$GITHUB_OUTPUT"
          else
            # Branch dispatch builds and caches packages but never publishes.
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    if: needs.prepare.outputs.build == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require Cachix upload token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = 1
            cores = 8
      - uses: cachix/cachix-action@v17
        with:
          name: bkpr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build packages for ${{ matrix.system }}
        run: nix build --no-link .#bkpr .#libghostty-vt
      - name: Exercise packaged executable loaders
        run: |
          package=$(nix path-info .#bkpr)
          "$package/bin/bkpr" --help
          "$package/bin/bkprd" --help
      - name: Build standalone Apple Silicon installer
        if: matrix.system == 'aarch64-darwin' && (needs.prepare.outputs.release == 'true' || inputs.macos_installer_smoke)
        run: |
          openssl_source=$(nix build --no-link --print-out-paths .#bkpr.opensslSource)
          bash .github/scripts/macos-package.sh \
            "$(nix path-info .#bkpr.binaries)" "$(nix path-info .#bkpr.terminfo)" \
            "$openssl_source" "$RUNNER_TEMP/bkpr-macos-arm64-unsigned.pkg"
      - uses: actions/upload-artifact@v4
        if: matrix.system == 'aarch64-darwin' && (needs.prepare.outputs.release == 'true' || inputs.macos_installer_smoke)
        with:
          name: bkpr-macos-arm64
          path: ${{ runner.temp }}/bkpr-macos-arm64-unsigned.pkg
          if-no-files-found: error
          overwrite: true
  verify-macos-installer:
    if: needs.prepare.outputs.release == 'true' || inputs.macos_installer_smoke
    needs: [prepare, build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bkpr-macos-arm64
          path: ${{ runner.temp }}
      - name: Install and run on a Mac without Nix
        run: |
          test ! -d /nix/store
          sudo installer -pkg "$RUNNER_TEMP/bkpr-macos-arm64-unsigned.pkg" -target /
          python3 .github/scripts/smoke-macos-package.py
  promote-unstable:
    if: >-
      always() && !cancelled() && github.ref_type == 'tag' && github.ref_name != 'unstable' &&
      needs.build.result == 'success' &&
      (needs.prepare.outputs.release != 'true' || needs.verify-macos-installer.result == 'success')
    needs:
      - prepare
      - build
      - verify-macos-installer
    runs-on: ubuntu-24.04
    concurrency:
      group: unstable-tag-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Advance unstable after a successful tagged build
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/tag-policy.sh promote "$TAG"
  release:
    name: Publish release notes and installer
    if: github.ref_type == 'tag' && needs.prepare.outputs.release == 'true'
    needs:
      - prepare
      - build
      - verify-macos-installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bkpr-macos-arm64
      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release-notes.mjs "$TAG" > release-notes.md
          printf '\nThe macOS installer is unsigned and not notarized. Gatekeeper may require manual approval. Nix remains available.\n' >> release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: bkpr-macos-arm64-unsigned.pkg
          fail_on_unmatched_files: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          tag_name: ${{ github.ref_name }}
  showcase:
    name: Capture published release showcase
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/showcase.yml
    with:
      release_tag: ${{ github.ref_name }}
