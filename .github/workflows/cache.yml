name: Cache tagged packages

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.policy.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: policy
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/tag-policy.sh build "$TAG" >> "$GITHUB_OUTPUT"

  build:
    if: github.ref_type == 'tag' && needs.prepare.outputs.build == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Require Cachix upload token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: bkpr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build packages for ${{ matrix.system }}
        run: nix build --no-link .#bkpr .#bkpr-native .#bkpr-zellij

  promote-unstable:
    if: github.ref_type == 'tag' && github.ref_name != 'unstable'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: unstable-tag-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Advance unstable after a successful tagged build
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/tag-policy.sh promote "$TAG"

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
