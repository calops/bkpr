name: Build, cache and publish
on:
  push:
    tags:
      - "**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.policy.outputs.build }}
      release: ${{ steps.policy.outputs.release }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: policy
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            bash .github/scripts/tag-policy.sh build "$TAG" >> "$GITHUB_OUTPUT"
            bash .github/scripts/classify-tag.sh "$TAG" >> "$GITHUB_OUTPUT"
          else
            # Branch dispatch builds and caches packages but never publishes.
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    if: needs.prepare.outputs.build == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Require Cachix upload token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = 1
            cores = 8
      - uses: cachix/cachix-action@v17
        with:
          name: bkpr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build packages for ${{ matrix.system }}
        run: nix build --no-link .#bkpr .#libghostty-vt
      - name: Exercise packaged executable loaders
        run: |
          package=$(nix path-info .#bkpr)
          "$package/bin/bkpr" --help
          "$package/bin/bkprd" --help
  promote-unstable:
    if: github.ref_type == 'tag' && github.ref_name != 'unstable'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    concurrency:
      group: unstable-tag-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Advance unstable after a successful tagged build
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/tag-policy.sh promote "$TAG"
  release:
    name: Publish release notes
    if: github.ref_type == 'tag' && needs.prepare.outputs.release == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-notes.mjs "$TAG" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          tag_name: ${{ github.ref_name }}
